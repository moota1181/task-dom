<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>مدير المهام</title>
    <link rel="stylesheet" href="style (1).css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>مهامي</h1>
        <button class="ghost" id="themeBtn" type="button">🌓</button>
      </header>

      <form id="taskForm">
        <input
          type="text"
          id="taskInput"
          placeholder="اكتب مهمة جديدة…"
          autocomplete="off"
        />
        <button type="submit">إضافة</button>
      </form>

      <div class="filters" id="filters">
        <button type="button" data-filter="all" class="active">الكل</button>
        <button type="button" data-filter="active">المتبقي</button>
        <button type="button" data-filter="done">المنجز</button>
      </div>

      <ul id="taskList"></ul>
      <div class="empty" id="empty" hidden>مفيش مهام هنا</div>

      <footer>
        <span id="counter"></span>
        <button class="ghost" id="clearDone" type="button">مسح المنجز</button>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
